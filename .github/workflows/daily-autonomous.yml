name: Daily Autonomous Engineering

on:
  schedule:
    # 03:00 UTC every day — off-peak, avoids peak API load
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no file writes or git push)'
        type: boolean
        default: false
      task_id:
        description: 'Force a specific task ID (e.g. TD-03). Leave blank for auto-priority.'
        type: string
        default: ''

permissions:
  contents: write   # needed for git push

jobs:
  autonomous-session:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          # Always work on the designated development branch
          ref: claude/improve-quality-reduce-debt-jvOBx
          fetch-depth: 2   # need HEAD~1 for architect diff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix ui/server

      - name: Install web dependencies
        run: npm ci --prefix ui/web

      - name: Configure git identity
        run: |
          git config user.name  "autonomous-engineer[bot]"
          git config user.email "autonomous-engineer[bot]@users.noreply.github.com"

      - name: Run autonomous session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="$FLAGS --dry-run"; fi
          if [ -n "${{ inputs.task_id }}" ]; then FLAGS="$FLAGS --item ${{ inputs.task_id }}"; fi
          node scripts/autonomous-run.js $FLAGS

      - name: Upload session artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-session-${{ github.run_id }}
          path: |
            docs/memory/session_log.md
            docs/memory/active_tasks.md
          retention-days: 30
